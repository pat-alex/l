<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المكتبة الصوتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #edf1ef;
    --surface: #ffffff;
    --ink: #16302d;
    --muted: #5a6f6b;
    --line: #d5dedb;
    --accent: #e0932b;
    --accent-ink: #1b1304;
    --teal: #1f6f66;
    --head: "Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
    --body: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b19;
      --surface: #162624;
      --ink: #e6efec;
      --muted: #9db3ae;
      --line: #284340;
      --accent: #f0a93f;
      --accent-ink: #1b1304;
      --teal: #4fb5a8;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.8;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- رأس الصفحة ---------- */
  .site-head { padding: 56px 0 8px; }
  .site-head h1 {
    margin: 0 0 8px;
    font-family: var(--head);
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    line-height: 1.25;
  }
  .site-head p { margin: 0; max-width: 60ch; color: var(--muted); }

  /* ---------- المجموعات ---------- */
  .group { margin-top: 56px; }
  .group-head {
    padding-inline-start: 18px;
    border-inline-start: 5px solid var(--accent);
    margin-bottom: 24px;
  }
  .group-head h2 {
    margin: 0;
    font-family: var(--head);
    font-weight: 600;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.4;
  }
  .group-head p { margin: 4px 0 0; max-width: 62ch; color: var(--muted); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 16px;
  }

  /* ---------- البطاقة ---------- */
  .card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .2s;
  }
  .card.playing { border-color: var(--accent); }

  .card-title { display: flex; align-items: center; gap: 12px; }
  .card h3 {
    margin: 0;
    font-family: var(--head);
    font-weight: 600;
    font-size: 1.25rem;
    line-height: 1.5;
  }
  .card > p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; line-height: 1.8; }

  /* موجات صغيرة تظهر أثناء التشغيل فقط */
  .eq { display: none; align-items: flex-end; gap: 2px; height: 16px; flex: none; }
  .card.playing .eq { display: inline-flex; }
  .eq i {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    height: 40%;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq i:nth-child(2) { animation-delay: .2s; }
  .eq i:nth-child(3) { animation-delay: .4s; }
  .eq i:nth-child(4) { animation-delay: .1s; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  @media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 70%; } }

  /* ---------- المشغّل ---------- */
  .player { display: flex; align-items: center; gap: 12px; margin-top: auto; direction: ltr; }
  .play {
    flex: none;
    width: 48px; height: 48px;
    border: 0; border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .play svg { width: 20px; height: 20px; fill: currentColor; }
  .play .i-pause { display: none; }
  .card.playing .play .i-play { display: none; }
  .card.playing .play .i-pause { display: block; }
  .card.loading .play { opacity: .7; cursor: progress; }

  .track { flex: 1; min-width: 0; }
  .times {
    display: flex; justify-content: space-between;
    font-size: .8rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.4; margin-top: 2px;
  }

  input[type="range"] {
    --pct: 0%;
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--teal) var(--pct), var(--line) var(--pct));
  }
  input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--teal); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); border: 2px solid var(--surface);
    margin-top: -5px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--teal); border: 2px solid var(--surface);
  }

  .speed {
    flex: none; min-width: 48px; height: 32px;
    border: 1px solid var(--line); border-radius: 16px;
    background: transparent; color: var(--ink);
    font: 600 .85rem var(--body);
    cursor: pointer;
  }

  .play:focus-visible, .speed:focus-visible, input[type="range"]:focus-visible, .drive-link:focus-visible {
    outline: 3px solid var(--teal); outline-offset: 2px;
  }

  .drive-link {
    align-self: flex-start;
    margin-top: 10px;
    font-size: .85rem;
    color: var(--teal);
  }

  /* مشغّل درايف الاحتياطي */
  .fallback { margin-top: auto; }
  .fallback iframe { width: 100%; height: 80px; border: 0; border-radius: 10px; background: var(--line); }
  .fallback small { display: block; margin-top: 6px; color: var(--muted); font-size: .8rem; line-height: 1.6; }

  .site-foot { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <h1>المكتبة الصوتية</h1>
    <p>حلقات صوتية قصيرة يمكنك الاستماع إليها مباشرة من الصفحة، مقسّمة حسب الموضوع.</p>
  </header>

  <main>

    <!-- =====================================================================
         طريقة الإضافة:

         1) لإضافة بطاقة جديدة: انسخ كتلة <article class="card" ...> كاملة
            والصقها داخل <div class="cards"> الخاص بالمجموعة المطلوبة، ثم غيّر:
              - data-drive  ← رابط الملف من درايف (الرابط كامل أو الـ ID فقط)
              - العنوان داخل <h3>
              - الوصف داخل <p>

         2) لإضافة مجموعة جديدة: انسخ كتلة <section class="group"> كاملة
            والصقها بعد آخر مجموعة، وغيّر عنوانها ووصفها.

         3) تأكد أن ملف الصوت في درايف مشارَك بخيار:
            "أي شخص لديه الرابط" (Anyone with the link).
         ===================================================================== -->

    <!-- ============ المجموعة الأولى ============ -->
    <section class="group">
      <div class="group-head">
        <h2>عنوان المجموعة الأولى</h2>
        <p>وصف مختصر يوضح محتوى هذه المجموعة من الحلقات.</p>
      </div>

      <div class="cards">

        <!-- بطاقة -->
        <article class="card" data-drive="https://drive.google.com/file/d/1LvXqzxh_8xcBfdoCr8xGQtzCFoq3elNl/view?usp=sharing">
          <div class="card-title"><h3>عنوان الحلقة</h3></div>
          <p>شرح مبسط عن محتوى هذه الحلقة في سطرين أو ثلاثة.</p>
        </article>

        <!-- ضع البطاقات الجديدة هنا (انسخ البطاقة أعلاه) -->

      </div>
    </section>

    <!-- ============ المجموعة الثانية (قالب جاهز: شيل علامات التعليق وعدّل) ============ -->
    <!--
    <section class="group">
      <div class="group-head">
        <h2>عنوان المجموعة الثانية</h2>
        <p>وصف المجموعة.</p>
      </div>
      <div class="cards">
        <article class="card" data-drive="ضع رابط درايف هنا">
          <div class="card-title"><h3>عنوان الحلقة</h3></div>
          <p>وصف الحلقة.</p>
        </article>
      </div>
    </section>
    -->

  </main>

  <footer class="site-foot">يتم تشغيل الملفات الصوتية مباشرة من Google Drive.</footer>
</div>

<script>
(function () {
  var SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
  var current = null; // البطاقة التي تعمل الآن

  function extractId(v) {
    v = (v || '').trim();
    var m = v.match(/\/d\/([-\w]+)/) || v.match(/[?&]id=([-\w]+)/);
    return m ? m[1] : v;
  }

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    var mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(x).padStart(2, '0');
  }

  function build(card) {
    var id = extractId(card.dataset.drive);
    if (!id) return;

    // العنوان + موجات التشغيل
    var titleRow = card.querySelector('.card-title');
    if (titleRow && !titleRow.querySelector('.eq')) {
      var eq = document.createElement('span');
      eq.className = 'eq';
      eq.setAttribute('aria-hidden', 'true');
      eq.innerHTML = '<i></i><i></i><i></i><i></i>';
      titleRow.appendChild(eq);
    }

    var player = document.createElement('div');
    player.className = 'player';
    player.innerHTML =
      '<button class="play" type="button" aria-label="تشغيل">' +
        '<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>' +
        '<svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>' +
      '</button>' +
      '<div class="track">' +
        '<input type="range" min="0" max="100" step="0.1" value="0" aria-label="موضع التشغيل">' +
        '<div class="times"><span class="cur">0:00</span><span class="dur">--:--</span></div>' +
      '</div>' +
      '<button class="speed" type="button" aria-label="سرعة التشغيل">1×</button>';
    card.appendChild(player);

    var link = document.createElement('a');
    link.className = 'drive-link';
    link.href = 'https://drive.google.com/file/d/' + id + '/view';
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'فتح الملف في درايف';
    card.appendChild(link);

    var audio = new Audio();
    audio.preload = 'none';
    audio.src = 'https://drive.google.com/uc?export=download&id=' + id;

    var playBtn = player.querySelector('.play');
    var speedBtn = player.querySelector('.speed');
    var range = player.querySelector('input[type="range"]');
    var cur = player.querySelector('.cur');
    var dur = player.querySelector('.dur');
    var speedIdx = 0;

    function useFallback() {
      audio.pause();
      card.classList.remove('playing', 'loading');
      var box = document.createElement('div');
      box.className = 'fallback';
      box.innerHTML =
        '<iframe src="https://drive.google.com/file/d/' + id + '/preview" allow="autoplay" title="مشغّل درايف"></iframe>' +
        '<small>تعذّر التشغيل المباشر، فتم استخدام مشغّل درايف. تأكد أن الملف مشارَك لأي شخص لديه الرابط.</small>';
      player.replaceWith(box);
    }

    playBtn.addEventListener('click', function () {
      if (audio.paused) {
        if (current && current !== audio) current.pause();
        card.classList.add('loading');
        var p = audio.play();
        if (p && p.catch) p.catch(function (e) {
          if (e && e.name !== 'AbortError') useFallback();
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('playing', function () {
      current = audio;
      card.classList.remove('loading');
      card.classList.add('playing');
      playBtn.setAttribute('aria-label', 'إيقاف مؤقت');
    });
    audio.addEventListener('pause', function () {
      card.classList.remove('playing', 'loading');
      playBtn.setAttribute('aria-label', 'تشغيل');
    });
    audio.addEventListener('ended', function () {
      card.classList.remove('playing');
      range.value = 0; range.style.setProperty('--pct', '0%'); cur.textContent = '0:00';
    });
    audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', function () {
      if (!isFinite(audio.duration) || !audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      range.value = pct;
      range.style.setProperty('--pct', pct + '%');
      cur.textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('error', useFallback);

    range.addEventListener('input', function () {
      if (isFinite(audio.duration) && audio.duration) {
        audio.currentTime = (range.value / 100) * audio.duration;
        range.style.setProperty('--pct', range.value + '%');
      }
    });

    speedBtn.addEventListener('click', function () {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      audio.playbackRate = SPEEDS[speedIdx];
      speedBtn.textContent = SPEEDS[speedIdx] + '×';
    });
  }

  document.querySelectorAll('.card[data-drive]').forEach(build);
})();
</script>
</body>
</html>
